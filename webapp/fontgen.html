<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字体生成 · myhand</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0}header .sp{flex:1}header a{color:var(--muted);text-decoration:none}
main{max-width:1280px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:14px inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabFail{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:#dc2626;color:#fff;font-size:10px;line-height:17px;text-align:center;font-weight:700}
.bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar label{font-size:12px;color:var(--muted)}.bar select,.bar input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:13px inherit;background:#fff}
.bar button{border:0;border-radius:9px;padding:9px 14px;background:var(--accent);color:#fff;font:13px inherit;cursor:pointer}
.bar button:disabled{opacity:.5;cursor:wait}.bar .ghost{background:#eef2ff;color:#1e40af}
#status{min-height:20px;margin:6px 0 10px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;position:relative}
.card.approved{border-color:#bbf7d0;background:#f0fdf4}.card.off{opacity:.55}
.card.failed{border-color:#dc2626!important;box-shadow:0 0 0 3px #fecaca;background:#fff5f5}
.card.failed .ch{color:#b91c1c}
.card img{width:78px;height:78px;object-fit:contain;background:#fff;display:block;margin:0 auto}
.card .ch{font-size:12px;margin:2px 0;font-weight:600}.card .ch small{font-weight:400;color:var(--muted)}
.card .row{display:flex;gap:4px;justify-content:center;align-items:center}
.card button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 7px;cursor:pointer;font-size:12px}
.card button:hover{border-color:var(--accent);color:var(--accent)}
.card .ok{font-size:11px;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0}.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.7}.note b{color:var(--ink)}
#result{font-size:13px;margin-top:10px}
#result a{color:var(--accent);font-weight:600}
@media(max-width:640px){main{padding:10px}.bar select{max-width:130px}}
</style>
</head>
<body>
<header><h1>字体生成 · 逐字审核</h1><span class="sp"></span><a href="/">← 返回采集板</a></header>
<main>
  <div class="tabs">
    <button id="tabHand" class="on">手写体<span class="tabFail" id="tabFailHand" hidden></span></button>
    <button id="tabBrush">毛笔<span class="tabFail" id="tabFailBrush" hidden></span></button>
  </div>
  <div class="bar">
    <label>字库 <select id="source">
      <option value="mine">我的 2000 字</option>
      <option value="gb2312">GB2312 简体 6763</option>
      <option value="big5">Big5 繁体 13053</option>
      <option value="both">简繁合一（GB2312 + 繁体码位）</option>
    </select></label>
    <label id="formatWrap">输出 <select id="format"><option value="ttf">标准 TTF（Word 可用）</option><option value="single">单线 SVG 包</option></select></label>
    <label>搜索 <input id="search" placeholder="字或页码"></label>
    <button id="btnAll">一键全部生成</button>
    <button id="btnAllStop" class="ghost" hidden>停止</button>
    <button id="btnResume" class="ghost" hidden>继续任务</button>
    <button id="btnBuild">生成字体</button>
    <button id="btnReload" class="ghost">刷新</button>
  </div>
  <div class="note">勾选“保留”的字才会进入字体；不满意的点“重生成”用对应模型再生成一个版本。毛笔只输出标准 TTF。</div>
  <div id="status">加载中…</div>
  <div id="grid" class="grid"></div>
  <div class="pager"><button id="prev">← 上一页</button><span id="pageInfo">—</span><button id="next">下一页 →</button></div>
  <div id="result"></div>
</main>
<script>
const PAGE = 120;
let style = "hand", all = [], page = 0, filtered = [], busy = false, loadSeq = 0;
let batchState = {hand: {job: null, running: false, cancelled: false}, brush: {job: null, running: false, cancelled: false}};
const stateCache = new Map();
let batchTimers = {hand: null, brush: null};
let failedChars = {hand: new Set(), brush: new Set()};
let failedCounts = {hand: 0, brush: 0};
let building = false;
const $ = s => document.querySelector(s);

function setStatus(t, color) { $("#status").textContent = t; $("#status").style.color = color || "var(--muted)"; }

async function preloadState(styleName) {
  const source = $("#source").value;
  const key = `${styleName}|${source}`;
  if (stateCache.has(key)) return;
  try {
    const r = await fetch(`/api/fontgen/state?style=${styleName}&source=${source}`);
    const j = await r.json();
    if (r.ok && j.ok) stateCache.set(key, j.chars || []);
  } catch (_) {}
}

async function load(styleName) {
  const seq = ++loadSeq;
  style = styleName;
  $("#tabHand").classList.toggle("on", style === "hand");
  $("#tabBrush").classList.toggle("on", style === "brush");
  $("#formatWrap").style.display = style === "hand" ? "" : "none";
  const source = $("#source").value;
  const key = `${style}|${source}`;
  const showLoaded = () => {
    const have = all.filter(x => x.preview && !x.missing).length;
    if (!building) setStatus(`${style === "hand" ? "手写体" : "毛笔"} ${all.length} 字 · 已有 ${have} · 缺 ${all.length - have}`);
    refreshBatchControls();
    const s = batchState[style];
    if (!building && s && s.job && s.job.id) renderJobStatus(s.job);
  };
  const cached = stateCache.get(key);
  if (cached) {
    all = cached; page = 0; applyFilter(); showLoaded();
    return;
  }
  if (!building) setStatus("加载中…");
  const r = await fetch(`/api/fontgen/state?style=${style}&source=${source}`);
  const j = await r.json();
  if (seq !== loadSeq) return;
  if (!r.ok || !j.ok) { setStatus("加载失败：" + (j.error || r.status), "var(--bad)"); return; }
  all = j.chars || [];
  stateCache.set(key, all);
  page = 0; applyFilter(); showLoaded();
}

function applyFilter() {
  const q = ($("#search").value || "").trim();
  filtered = q ? all.filter(x => x.char.includes(q)) : all.slice();
  page = 0; render();
}

function render() {
  const start = page * PAGE, rows = filtered.slice(start, start + PAGE);
  $("#grid").innerHTML = rows.map(x => {
    const ch = x.char;
    const failed = failedChars[style]?.has(ch) ? "failed" : "";
    return `<div class="card ${x.approved ? "approved" : "off"} ${failed}" data-ch="${ch}">
      <img src="${x.preview}&t=${x.updated || (x.approved ? 1 : Date.now())}" loading="lazy" alt="${ch}">
      <div class="ch">${ch} <small>U+${ch.codePointAt(0).toString(16).toUpperCase()}</small></div>
      <div class="row"><label class="ok"><input type="checkbox" class="approve" ${x.approved ? "checked" : ""}> 保留</label></div>
      <div class="row"><button class="regen">重生成</button></div>
    </div>`;
  }).join("");
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  $("#pageInfo").textContent = `第 ${page + 1} / ${pages} 页 · ${filtered.length} 字`;
  $("#prev").disabled = page <= 0; $("#next").disabled = page >= pages - 1;
}

$("#grid").addEventListener("change", async e => {
  const cb = e.target.closest(".approve"); if (!cb) return;
  const card = cb.closest(".card"); const ch = card.dataset.ch;
  card.classList.toggle("approved", cb.checked); card.classList.toggle("off", !cb.checked);
  all.find(x => x.char === ch).approved = cb.checked;
  await fetch("/api/fontgen/approve", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({style,char:ch,approved:cb.checked})});
});

async function setCardImage(card, url) {
  const img = card.querySelector("img");
  if (!img) return;
  try {
    const r = await fetch(url + "&cb=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    const obj = URL.createObjectURL(blob);
    img.onload = () => URL.revokeObjectURL(obj);
    img.src = obj;
  } catch (_) {
    img.src = url + "&cb=" + Date.now();
  }
}

$("#grid").addEventListener("click", async e => {
  const btn = e.target.closest(".regen"); if (!btn) return;
  const card = btn.closest(".card"); const ch = card.dataset.ch;
  if (busy) return; busy = true; btn.disabled = true; btn.textContent = "…";
  const reqStyle = style;
  setStatus(`正在用${reqStyle === "hand" ? "手写" : "毛笔"}模型生成「${ch}」…`);
  try {
    const r = await fetch("/api/fontgen/regen", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({style:reqStyle, font: reqStyle === "brush" ? 1 : 0, char:ch})});
    const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    const x = all.find(z => z.char === ch);
    if (x) { x.approved = true; x.missing = false; x.updated = Date.now(); x.preview = j.preview; }
    await setCardImage(card, j.preview);
    card.classList.add("approved"); card.classList.remove("off", "failed");
    if (failedChars[reqStyle]) failedChars[reqStyle].delete(ch);
    failedCounts[reqStyle] = Math.max(0, (failedCounts[reqStyle] || 0) - 1);
    updateTabBadges();
    card.querySelector(".approve").checked = true;
    setStatus(`「${ch}」已更新`, "var(--ok)");
  } catch (err) { setStatus("生成失败：" + err.message, "var(--bad)"); }
  finally { busy = false; btn.disabled = false; btn.textContent = "重生成"; }
});

function jobKey(st) { return `fontgenJob:${st}`; }

function updateTabBadges() {
  for (const st of ["hand", "brush"]) {
    const el = st === "hand" ? $("#tabFailHand") : $("#tabFailBrush");
    const n = failedCounts[st] || 0;
    el.textContent = n ? String(n) : "";
    el.hidden = !n;
  }
}

function refreshBatchControls() {
  const s = batchState[style];
  $("#btnAll").disabled = !!s.running;
  $("#btnAllStop").hidden = !s.running;
  $("#btnResume").hidden = !s.cancelled;
  $("#btnBuild").disabled = false;
}

function jobLabel(j) { return j.style === "brush" ? "毛笔" : "手写"; }

function renderJobStatus(j) {
  const pct = j.total ? Math.min(100, Math.round((j.done / j.total) * 100)) : 0;
  if (j.status === "running" || j.status === "stopping") {
    setStatus(`${jobLabel(j)}任务 ${j.id} · ${j.done}/${j.total}（${pct}%）· 当前「${j.current || "…"}」· 失败 ${j.failed}`);
  } else if (j.status === "cancelled" && j.index < j.total) {
    setStatus(`${jobLabel(j)}任务已暂停：${j.done}/${j.total}（${pct}%），可点「继续任务」断点续传`, "var(--bad)");
  } else {
    setStatus(`${jobLabel(j)}任务${j.status === "done" ? "已完成" : "已停止"}：${j.done}/${j.total}，失败 ${j.failed}`, j.status === "done" ? "var(--ok)" : "var(--bad)");
  }
}

function applyJobItems(items) {
  for (const it of items || []) {
    const x = all.find(z => z.char === it.char);
    if (x) { x.approved = true; x.missing = false; x.updated = it.updated; }
    const card = document.querySelector(`.card[data-ch="${it.char}"]`);
    if (card) {
      if (!card.dataset.updating) {
        card.dataset.updating = "1";
        setCardImage(card, it.preview).finally(() => { delete card.dataset.updating; });
      }
      card.classList.add("approved"); card.classList.remove("off", "failed");
      if (failedChars[style] && failedChars[style].delete(it.char)) failedCounts[style] = Math.max(0, failedCounts[style] - 1);
      updateTabBadges();
      const cb = card.querySelector(".approve"); if (cb) cb.checked = true;
    }
  }
}

async function pollJob(jobId, jobStyle) {
  if (batchTimers[jobStyle]) clearTimeout(batchTimers[jobStyle]);
  try {
    const r = await fetch(`/api/fontgen/batch/status?job=${encodeURIComponent(jobId)}`);
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    const s = batchState[jobStyle];
    s.job = j;
    s.running = j.status === "running" || j.status === "stopping";
    s.cancelled = j.status === "cancelled" && j.index < j.total;
    failedChars[jobStyle] = new Set(j.failed_chars || []);
    failedCounts[jobStyle] = Number(j.failed || 0);
    updateTabBadges();
    if (jobStyle === style) {
      syncFailedClasses();
      if (j.style === style) applyJobItems(j.items || []);
      if (!building) renderJobStatus(j);
      refreshBatchControls();
    }
    if (s.running) {
      batchTimers[jobStyle] = setTimeout(() => pollJob(jobId, jobStyle), 1500);
    } else if (j.status === "done") {
      localStorage.removeItem(jobKey(jobStyle));
      s.job = null; s.running = false; s.cancelled = false;
      if (jobStyle === style) { refreshBatchControls(); await load(style); }
    } else if (jobStyle === style) {
      refreshBatchControls();
    }
  } catch (e) {
    if (jobStyle === style) setStatus("任务状态查询失败：" + e.message, "var(--bad)");
    batchTimers[jobStyle] = setTimeout(() => pollJob(jobId, jobStyle), 3000);
  }
}

function syncFailedClasses() {
  document.querySelectorAll(".card").forEach(card => {
    card.classList.toggle("failed", failedChars[style].has(card.dataset.ch));
  });
}

async function discoverActiveJobs() {
  try {
    const r = await fetch("/api/fontgen/batch/active", {cache: "no-store"});
    const j = await r.json();
    if (!r.ok || !j.ok) return;
    const src = (j.jobs || []).find(x => x.source)?.source;
    if (src && $("#source").value !== src) { $("#source").value = src; load(style); }
    for (const job of j.jobs || []) {
      const st = job.style;
      if (st !== "hand" && st !== "brush") continue;
      const key = jobKey(st);
      if (!localStorage.getItem(key)) {
        localStorage.setItem(key, job.id);
        batchState[st].job = job.id;
        pollJob(job.id, st);
      }
    }
  } catch (_) {}
}

async function pollStoredJobs() {
  await discoverActiveJobs();
  for (const st of ["hand", "brush"]) {
    const id = localStorage.getItem(jobKey(st));
    if (id) { batchState[st].job = id; pollJob(id, st); }
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) pollStoredJobs();
});

async function resumeBatch() {
  const job = localStorage.getItem(jobKey(style));
  if (!job) { setStatus("没有可继续的任务", "var(--bad)"); return; }
  $("#btnResume").disabled = true;
  try {
    const r = await fetch("/api/fontgen/batch/resume", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job})});
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    batchState[style].running = true; batchState[style].cancelled = false;
    refreshBatchControls();
    setStatus(`从第 ${j.index} 个字继续…`);
    pollJob(job, style);
  } catch (e) {
    setStatus("继续失败：" + e.message, "var(--bad)");
  } finally { $("#btnResume").disabled = false; }
}

async function regenerateAll() {
  if (batchState[style].running) return;
  const total = all.length;
  if (!total) return;
  const label = style === "hand" ? "手写" : "毛笔";
  const ok = window.confirm(`将在服务端用${label}模型重新生成全部 ${total} 个字。\n\n可以同时另开另一个标签的任务；确定开始吗？`);
  if (!ok) return;
  setStatus(`正在创建${label}任务…`);
  try {
    const r = await fetch("/api/fontgen/batch/start", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({style,source:$("#source").value})});
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    localStorage.setItem(jobKey(style), j.job);
    batchState[style] = {job: j.job, running: true, cancelled: false};
    refreshBatchControls();
    pollJob(j.job, style);
  } catch (e) {
    refreshBatchControls();
    setStatus("创建任务失败：" + e.message, "var(--bad)");
  }
}

async function stopBatch() {
  const job = localStorage.getItem(jobKey(style));
  if (!job) { setStatus("当前标签没有运行中的任务", "var(--bad)"); return; }
  setStatus("正在停止当前标签的服务端任务…");
  try { await fetch("/api/fontgen/batch/stop", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job})}); } catch (_) {}
}

$("#btnAll").addEventListener("click", regenerateAll);
$("#btnAllStop").addEventListener("click", stopBatch);
$("#btnResume").addEventListener("click", resumeBatch);

$("#btnBuild").addEventListener("click", async () => {
  const fmt = style === "hand" ? $("#format").value : "ttf";
  const btn = $("#btnBuild"); btn.disabled = true; btn.textContent = "构建中…"; building = true;
  setStatus("正在构建字体，字多时需要一点时间…");
  $("#result").innerHTML = "";
  try {
    const source = $("#source").value;
    const r = await fetch("/api/fontgen/build", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({style,source,format:fmt})});
    const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    $("#result").innerHTML = `<a href="${j.download}">下载 ${j.file}</a> · ${j.glyphs} 个字形`;
    setStatus(`构建完成：${j.glyphs} 个字形`, "var(--ok)");
  } catch (err) { setStatus("构建失败：" + err.message, "var(--bad)"); }
  finally { building = false; btn.disabled = false; btn.textContent = "生成字体"; }
});

$("#tabHand").onclick = () => { localStorage.setItem("fontgenTab", "hand"); load("hand"); };
$("#tabBrush").onclick = () => { localStorage.setItem("fontgenTab", "brush"); load("brush"); };
$("#btnReload").onclick = () => load(style);
$("#search").addEventListener("input", applyFilter);
$("#source").addEventListener("change", () => { load(style).then(() => preloadState(style === "hand" ? "brush" : "hand")); });
$("#prev").onclick = () => { if (page > 0) { page--; render(); } };
$("#next").onclick = () => { const pages = Math.max(1, Math.ceil(filtered.length / PAGE)); if (page + 1 < pages) { page++; render(); } };
const _oldJob = localStorage.getItem("fontgenJob");
if (_oldJob && !localStorage.getItem("fontgenJob:hand")) localStorage.setItem("fontgenJob:hand", _oldJob);
const initialTab = localStorage.getItem("fontgenTab") === "brush" ? "brush" : "hand";
load(initialTab).then(() => {
  refreshBatchControls();
  pollStoredJobs();
  preloadState(initialTab === "hand" ? "brush" : "hand");
});
</script>
</body>
</html>
